name: Release and deploy wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read addon/release.json
        id: rel
        run: |
          echo "version=$(jq -r .version addon/release.json)" >> "$GITHUB_OUTPUT"
          echo "file=$(jq -r .file addon/release.json)" >> "$GITHUB_OUTPUT"
          echo "range=$(jq -r '.minecraftMin + " - " + .minecraftMax' addon/release.json)" >> "$GITHUB_OUTPUT"
          echo "notes=$(jq -r .notes addon/release.json)" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release (once per version)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.rel.outputs.version }}
          FILE: ${{ steps.rel.outputs.file }}
          RANGE: ${{ steps.rel.outputs.range }}
          NOTES: ${{ steps.rel.outputs.notes }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" "addon/$FILE" \
              --title "Deepcore Quarry $tag" \
              --notes "$NOTES"$'\n\n'"Works on Minecraft Bedrock $RANGE." \
              --latest
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wiki data from the .mcaddon
        run: |
          pip install pillow
          python tools/extract.py --repo "${{ github.repository }}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Blazor app
        run: |
          dotnet publish src/DeepcoreWiki/DeepcoreWiki.csproj -c Release -o out
          repo="${GITHUB_REPOSITORY#*/}"
          sed -i "s|<base href=\"/\" />|<base href=\"/$repo/\" />|" out/wwwroot/index.html
          cp out/wwwroot/index.html out/wwwroot/404.html
          touch out/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
